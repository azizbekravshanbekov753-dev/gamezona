<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameZone - Tic-Tac-Toe</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a1a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(10,10,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);}
    .nav-logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .back-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;transition:.2s;}
    .back-btn:hover{background:rgba(255,255,255,.12);}
    .coin-display{display:flex;align-items:center;gap:6px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;color:#fbbf24;}

    .game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
    .game-title{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}

    .conn-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;margin-bottom:14px;}
    .conn-badge.online{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3);}
    .conn-badge.offline{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}
    .conn-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    .players-bar{display:flex;align-items:center;gap:16px;margin-bottom:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 24px;width:100%;max-width:420px;}
    .player-info{display:flex;align-items:center;gap:10px;flex:1;}
    .player-info.right{flex-direction:row-reverse;text-align:right;}
    .p-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;transition:.3s;}
    .p-name{font-size:16px;font-weight:700;}
    .p-symbol{font-size:22px;margin-top:2px;}
    .vs-badge{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:rgba(255,255,255,.3);padding:6px 12px;background:rgba(255,255,255,.05);border-radius:8px;}
    .active-player .p-avatar{box-shadow:0 0 0 3px #6366f1,0 0 20px rgba(99,102,241,.4);}
    .active-player .p-name{color:#a78bfa;}

    .status-bar{font-size:18px;font-weight:700;text-align:center;min-height:28px;margin-bottom:16px;color:rgba(255,255,255,.7);}

    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
    .cell{width:clamp(90px,22vw,120px);height:clamp(90px,22vw,120px);background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.08);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,10vw,58px);cursor:pointer;transition:.25s;user-select:none;}
    .cell:hover:not(.taken){background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4);transform:scale(1.04);}
    .cell.x{color:#6366f1;text-shadow:0 0 20px rgba(99,102,241,.6);}
    .cell.o{color:#f43f5e;text-shadow:0 0 20px rgba(244,63,94,.6);}
    .cell.win{animation:pulse .6s ease infinite alternate;}
    @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08);filter:brightness(1.3)}}
    .cell.taken{cursor:not-allowed;}

    .controls{display:flex;gap:12px;}
    .ctrl-btn{padding:12px 28px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.3s;letter-spacing:1px;}
    .btn-play{background:linear-gradient(135deg,#6366f1,#8b5cf6);}
    .btn-play:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.4);}
    .btn-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    .btn-back:hover{background:rgba(255,255,255,.12);}

    .wait-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:150;}
    .wait-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:340px;width:90%;}
    .spinner{width:52px;height:52px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.1);border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .wait-title{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;margin-bottom:8px;}
    .wait-code{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;color:#fbbf24;letter-spacing:4px;margin:12px 0;}
    .wait-sub{color:rgba(255,255,255,.4);font-size:13px;margin-bottom:18px;}
    .cancel-btn{padding:10px 24px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);border-radius:10px;color:#f87171;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}

    .result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;}
    .result-overlay.show{display:flex;}
    .result-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:340px;width:90%;animation:bounceIn .4s ease;}
    @keyframes bounceIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .result-icon{font-size:68px;display:block;margin-bottom:14px;line-height:1;}
    .result-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;margin-bottom:8px;}
    .result-sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:8px;}
    .result-coins{color:#fbbf24;font-size:17px;font-weight:700;margin-bottom:24px;}
    .result-btns{display:flex;gap:12px;justify-content:center;}
    .res-btn{padding:11px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;}
    .res-play{background:linear-gradient(135deg,#6366f1,#8b5cf6);}
    .res-play:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.4);}
    .res-home{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    .res-home:hover{background:rgba(255,255,255,.12);}
  </style>
</head>
<body>

<nav class="navbar">
  <button class="back-btn" onclick="goHome()">&#8592; Orqaga</button>
  <div class="nav-logo">&#9711; Tic-Tac-Toe</div>
  <div class="coin-display">&#9679; <span id="nav-coins">0</span></div>
</nav>

<div class="game-wrap">
  <h1 class="game-title">Tic-Tac-Toe</h1>
  <div class="conn-badge online" id="conn-badge">
    <span class="conn-dot"></span>
    <span id="conn-text">Ulangan</span>
  </div>

  <div class="players-bar">
    <div class="player-info active-player" id="p1-info">
      <div class="p-avatar" id="p1-av">?</div>
      <div>
        <div class="p-name" id="p1-name">O&#39;yinchi 1</div>
        <div class="p-symbol x">&#10005;</div>
      </div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="player-info right" id="p2-info">
      <div class="p-avatar" id="p2-av">?</div>
      <div>
        <div class="p-name" id="p2-name">O&#39;yinchi 2</div>
        <div class="p-symbol o">&#9711;</div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status">Yuklanmoqda...</div>

  <div class="board" id="board">
    <div class="cell" onclick="makeMove(0)"></div>
    <div class="cell" onclick="makeMove(1)"></div>
    <div class="cell" onclick="makeMove(2)"></div>
    <div class="cell" onclick="makeMove(3)"></div>
    <div class="cell" onclick="makeMove(4)"></div>
    <div class="cell" onclick="makeMove(5)"></div>
    <div class="cell" onclick="makeMove(6)"></div>
    <div class="cell" onclick="makeMove(7)"></div>
    <div class="cell" onclick="makeMove(8)"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-play" onclick="resetGame()">&#8635; Qayta</button>
    <button class="ctrl-btn btn-back" onclick="goHome()">&#8962; Uy</button>
  </div>
</div>

<!-- Waiting overlay: only shown to host -->
<div class="wait-overlay" id="wait-overlay" style="display:none">
  <div class="wait-box">
    <div class="spinner"></div>
    <div class="wait-title">Raqib kutilmoqda...</div>
    <div class="wait-sub">Xona kodi:</div>
    <div class="wait-code" id="wait-code">&#8212;</div>
    <div class="wait-sub">Raqibingizga shu kodni yuboring</div>
    <button class="cancel-btn" onclick="goHome()">&#10006; Bekor</button>
  </div>
</div>

<!-- Result overlay -->
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="result-icon" id="res-icon">&#9733;</span>
    <div class="result-title" id="res-title"></div>
    <div class="result-sub"   id="res-sub"></div>
    <div class="result-coins" id="res-coins"></div>
    <div class="result-btns">
      <button class="res-btn res-play" onclick="resetGame()">&#8635; Qayta</button>
      <button class="res-btn res-home" onclick="goHome()">&#8962; Uy</button>
    </div>
  </div>
</div>

<script src="firebase.js"></script>
<script src="coins.js"></script>
<script>
// ── SESSION ──
var session  = JSON.parse(localStorage.getItem('gz_session') || '{}');
var myKey    = localStorage.getItem('gz_current_user') || '';
var p1Key    = session.player1 || myKey;
var p2Key    = session.player2 || 'cpu';
var roomCode = session.roomCode || '';
var reward   = session.reward   || 50;
var isSolo   = !session.player2 || session.player2 === 'cpu';
var amIP1    = myKey === p1Key;

var usersObj = getUsers();
var p1User   = usersObj[p1Key] || { username: p1Key || "O'yinchi 1", skinColor: '#6366f1' };
var p2User   = isSolo
  ? { username: 'CPU [AI]', skinColor: '#f43f5e' }
  : (usersObj[p2Key] || { username: p2Key, skinColor: '#f43f5e' });

// ── WIN LINES ──
var WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

// ── STATE ──
var board, currentTurn, gameOver, _stateUnsub, _cancelRoom;

// ── INIT ──
window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('nav-coins').textContent = getCurrentUser()?.coins || 0;
  setupPlayers();
  resetGame();
  if (!isSolo) initMultiplayer();
});

function setupPlayers() {
  document.getElementById('p1-name').textContent        = p1User.username;
  document.getElementById('p1-av').textContent          = p1User.username.charAt(0).toUpperCase();
  document.getElementById('p1-av').style.background     = p1User.skinColor || '#6366f1';
  document.getElementById('p2-name').textContent        = p2User.username;
  document.getElementById('p2-av').textContent          = p2User.username.charAt(0).toUpperCase();
  document.getElementById('p2-av').style.background     = p2User.skinColor || '#f43f5e';
  highlightActive();
}

// ── MULTIPLAYER ──
function initMultiplayer() {
  if (!roomCode) return;

  if (amIP1) {
    document.getElementById('wait-overlay').style.display = 'flex';
    document.getElementById('wait-code').textContent = roomCode;
  } else {
    document.getElementById('wait-overlay').style.display = 'none';
  }

  _cancelRoom = enterRoom('tictactoe', roomCode, myKey, function(p1, p2) {
    document.getElementById('wait-overlay').style.display = 'none';
    if (!p1 || !p2) {
      showToast('Ulanishda xatolik!', 'error');
      return;
    }
    showToast("O'yin boshlandi!");
    setConnBadge(true);
  });

  _stateUnsub = listenState('tictactoe', roomCode, function(data) {
    if (!data || gameOver) return;
    // Apply state when it's now our turn (opponent just moved or reset)
    var myMark  = amIP1 ? 'X' : 'O';
    if (data.turn === myMark || data.reset) {
      board       = data.board;
      currentTurn = data.turn;
      renderBoard();
      highlightActive();
      updateStatus();
      if (!data.reset) {
        var w = checkWinner();
        if (w) { endGame(w); return; }
        if (board.every(function(c){ return c !== ''; })) { endGame('draw'); return; }
      }
    }
  });

  setConnBadge(true);
}

function setConnBadge(online) {
  var b = document.getElementById('conn-badge');
  b.className = 'conn-badge ' + (online ? 'online' : 'offline');
  document.getElementById('conn-text').textContent = online ? 'Ulangan' : 'Ulanmagan';
}

// ── GAME LOGIC ──
function resetGame() {
  board       = ['','','','','','','','',''];
  currentTurn = 'X';
  gameOver    = false;
  document.getElementById('result-overlay').classList.remove('show');
  renderBoard();
  updateStatus();
  highlightActive();
  if (!isSolo) {
    sendState('tictactoe', roomCode, { board: board, turn: 'X', reset: true });
  }
}

function makeMove(idx) {
  if (gameOver || board[idx] !== '') return;

  if (!isSolo) {
    var myMark = amIP1 ? 'X' : 'O';
    if (currentTurn !== myMark) {
      showToast('Raqib navbati!', 'error');
      return;
    }
  }

  board[idx] = currentTurn;
  var cells   = document.querySelectorAll('.cell');
  cells[idx].innerHTML   = currentTurn === 'X' ? '&#10005;' : '&#9711;';
  cells[idx].classList.add(currentTurn.toLowerCase(), 'taken');

  var winner = checkWinner();
  if (winner) { endGame(winner); return; }
  if (board.every(function(c){ return c !== ''; })) { endGame('draw'); return; }

  var nextTurn = currentTurn === 'X' ? 'O' : 'X';

  if (!isSolo) {
    sendState('tictactoe', roomCode, { board: board, turn: nextTurn });
  }

  currentTurn = nextTurn;
  highlightActive();
  updateStatus();

  if (isSolo && currentTurn === 'O') {
    setTimeout(cpuMove, 520);
  }
}

// ── CPU ──
function cpuMove() {
  var move = findBestMove('O');
  if (move === null) move = findBestMove('X');
  if (move === null && board[4] === '') move = 4;
  if (move === null) move = randomEmpty();
  if (move !== null) makeMove(move);
}

function findBestMove(mark) {
  for (var i = 0; i < WINS.length; i++) {
    var a = WINS[i][0], b = WINS[i][1], c = WINS[i][2];
    var line = [board[a], board[b], board[c]];
    if (line.filter(function(v){ return v === mark; }).length === 2 && line.indexOf('') !== -1) {
      return [a, b, c][line.indexOf('')];
    }
  }
  return null;
}

function randomEmpty() {
  var empties = [];
  for (var i = 0; i < 9; i++) {
    if (board[i] === '') empties.push(i);
  }
  return empties.length ? empties[Math.floor(Math.random() * empties.length)] : null;
}

// ── WIN CHECK ──
function checkWinner() {
  for (var i = 0; i < WINS.length; i++) {
    var a = WINS[i][0], b = WINS[i][1], c = WINS[i][2];
    if (board[a] && board[a] === board[b] && board[b] === board[c]) {
      var cells = document.querySelectorAll('.cell');
      cells[a].classList.add('win');
      cells[b].classList.add('win');
      cells[c].classList.add('win');
      return board[a];
    }
  }
  return null;
}

function renderBoard() {
  var cells = document.querySelectorAll('.cell');
  for (var i = 0; i < 9; i++) {
    cells[i].innerHTML  = '';
    cells[i].className  = 'cell';
    if (board[i] === 'X') {
      cells[i].innerHTML = '&#10005;';
      cells[i].classList.add('x', 'taken');
    } else if (board[i] === 'O') {
      cells[i].innerHTML = '&#9711;';
      cells[i].classList.add('o', 'taken');
    }
  }
}

// ── UI HELPERS ──
function highlightActive() {
  document.getElementById('p1-info').classList.toggle('active-player', currentTurn === 'X');
  document.getElementById('p2-info').classList.toggle('active-player', currentTurn === 'O');
}

function updateStatus() {
  if (gameOver) return;
  var name   = currentTurn === 'X' ? p1User.username : p2User.username;
  var symbol = currentTurn === 'X' ? '&#10005;' : '&#9711;';
  document.getElementById('status').innerHTML = name + ' navbati (' + symbol + ')';
}

// ── END GAME ──
function endGame(result) {
  gameOver = true;
  if (_stateUnsub) { _stateUnsub(); _stateUnsub = null; }
  document.querySelectorAll('.cell').forEach(function(c){ c.classList.add('taken'); });

  var icon, title, sub, coinsText = '';

  if (result === 'draw') {
    icon  = '&#9868;';
    title = 'Durang!';
    sub   = "Ikki o'yinchi teng!";
  } else {
    var iWon = (result === 'X' && amIP1) || (result === 'O' && !amIP1) || (isSolo && result === 'X');
    if (iWon) {
      icon      = '&#9733;';
      title     = "G'OLIBSIZ!";
      sub       = 'Tabriklaymiz!';
      coinsText = '+&#9679; ' + reward + ' tanga!';
      addCoins(reward);
      addResult(true);
      document.getElementById('nav-coins').textContent = getCurrentUser()?.coins || 0;
    } else {
      icon  = '&#9711;';
      title = 'Yutqazdingiz';
      sub   = 'Keyingi safar omad!';
      addResult(false);
    }
  }

  setTimeout(function() {
    document.getElementById('res-icon').innerHTML    = icon;
    document.getElementById('res-title').textContent = title;
    document.getElementById('res-sub').textContent   = sub;
    document.getElementById('res-coins').innerHTML   = coinsText;
    document.getElementById('result-overlay').classList.add('show');
    refreshCoinDisplay();
  }, 600);
}

function goHome() {
  if (_stateUnsub) { _stateUnsub(); _stateUnsub = null; }
  if (_cancelRoom) { _cancelRoom(); _cancelRoom = null; }
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
