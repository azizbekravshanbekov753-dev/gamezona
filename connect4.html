<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameZone - Connect Four</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a1a;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(10,10,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);}
    .nav-logo{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .back-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;transition:.2s;}
    .back-btn:hover{background:rgba(255,255,255,.12);}
    .coin-display{display:flex;align-items:center;gap:6px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:6px 14px;font-size:15px;font-weight:700;color:#fbbf24;}

    .game-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;}
    .game-title{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;text-align:center;}

    .conn-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:14px;}
    .conn-badge.online{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3);}
    .conn-badge.offline{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}
    .conn-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    .players-bar{display:flex;align-items:center;gap:16px;margin-bottom:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 20px;width:100%;max-width:520px;}
    .player-info{display:flex;align-items:center;gap:10px;flex:1;}
    .player-info.right{flex-direction:row-reverse;text-align:right;}
    .p-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;transition:.3s;}
    .p-name{font-size:15px;font-weight:700;}
    .p-chip{width:18px;height:18px;border-radius:50%;display:inline-block;margin-top:3px;}
    .vs-badge{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:rgba(255,255,255,.3);padding:5px 10px;background:rgba(255,255,255,.05);border-radius:8px;}
    .active-player .p-avatar{box-shadow:0 0 0 3px #ef4444,0 0 20px rgba(239,68,68,.4);}
    .active-player.p2-wrap .p-avatar{box-shadow:0 0 0 3px #0ea5e9,0 0 20px rgba(14,165,233,.4);}
    .active-player .p-name{color:#fca5a5;}
    .active-player.p2-wrap .p-name{color:#7dd3fc;}

    .status-bar{font-size:17px;font-weight:700;text-align:center;min-height:26px;margin-bottom:12px;color:rgba(255,255,255,.7);}

    .board-wrap{background:rgba(14,165,233,.12);border:2px solid rgba(14,165,233,.25);border-radius:16px;padding:10px;margin-bottom:16px;}
    .col-buttons{display:flex;gap:8px;margin-bottom:8px;}
    .col-btn{flex:1;height:34px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;cursor:pointer;font-size:16px;transition:.2s;display:flex;align-items:center;justify-content:center;}
    .col-btn:hover:not(:disabled){background:rgba(99,102,241,.3);border-color:#6366f1;}
    .col-btn:disabled{opacity:.3;cursor:not-allowed;}
    .board{display:flex;flex-direction:column;gap:7px;}
    .row{display:flex;gap:7px;}
    .cell{width:clamp(36px,8vw,54px);height:clamp(36px,8vw,54px);border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.06);transition:.3s;}
    .cell.p1{background:#ef4444;border-color:#dc2626;box-shadow:0 0 12px rgba(239,68,68,.5);}
    .cell.p2{background:#0ea5e9;border-color:#0284c7;box-shadow:0 0 12px rgba(14,165,233,.5);}
    .cell.win{animation:wink .5s ease infinite alternate;}
    @keyframes wink{from{transform:scale(1)}to{transform:scale(1.14);filter:brightness(1.4)}}

    .controls{display:flex;gap:12px;}
    .ctrl-btn{padding:11px 26px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;letter-spacing:1px;}
    .btn-play{background:linear-gradient(135deg,#ef4444,#f97316);}
    .btn-play:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(239,68,68,.4);}
    .btn-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    .btn-back:hover{background:rgba(255,255,255,.12);}

    .wait-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:150;}
    .wait-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:320px;width:90%;}
    .spinner{width:52px;height:52px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.1);border-top-color:#ef4444;border-radius:50%;animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .wait-title{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;margin-bottom:8px;}
    .wait-code{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;color:#fbbf24;letter-spacing:4px;margin:12px 0;}
    .wait-sub{color:rgba(255,255,255,.4);font-size:13px;margin-bottom:18px;}
    .cancel-btn{padding:10px 24px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);border-radius:10px;color:#f87171;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}

    .result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;}
    .result-overlay.show{display:flex;}
    .result-box{background:#13132a;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:44px 36px;text-align:center;max-width:340px;width:90%;animation:bounceIn .4s ease;}
    @keyframes bounceIn{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .result-icon{font-size:68px;display:block;margin-bottom:14px;line-height:1;}
    .result-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;margin-bottom:8px;}
    .result-sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:6px;}
    .result-coins{color:#fbbf24;font-size:17px;font-weight:700;margin-bottom:26px;}
    .result-btns{display:flex;gap:12px;justify-content:center;}
    .res-btn{padding:11px 22px;border:none;border-radius:12px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:.3s;}
    .res-play{background:linear-gradient(135deg,#ef4444,#f97316);}
    .res-play:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(239,68,68,.4);}
    .res-home{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
    .res-home:hover{background:rgba(255,255,255,.12);}
  </style>
</head>
<body>

<nav class="navbar">
  <button class="back-btn" onclick="goHome()">&#8592; Orqaga</button>
  <div class="nav-logo">&#9635; Connect Four</div>
  <div class="coin-display">&#9679; <span id="nav-coins">0</span></div>
</nav>

<div class="game-wrap">
  <h1 class="game-title">Connect Four</h1>
  <div class="conn-badge online" id="conn-badge">
    <span class="conn-dot"></span>
    <span id="conn-text">Ulangan</span>
  </div>

  <div class="players-bar">
    <div class="player-info active-player" id="p1-info">
      <div class="p-avatar" id="p1-avatar">?</div>
      <div>
        <div class="p-name" id="p1-name">O&#39;yinchi 1</div>
        <span class="p-chip" style="background:#ef4444"></span>
      </div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="player-info right p2-wrap" id="p2-info">
      <div class="p-avatar" id="p2-avatar">?</div>
      <div>
        <div class="p-name" id="p2-name">O&#39;yinchi 2</div>
        <span class="p-chip" style="background:#0ea5e9"></span>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status">Yuklanmoqda...</div>

  <div class="board-wrap">
    <div class="col-buttons" id="col-btns"></div>
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-play" onclick="resetGame()">&#8635; Qayta O&#39;yna</button>
    <button class="ctrl-btn btn-back" onclick="goHome()">&#8962; Bosh Sahifa</button>
  </div>
</div>

<!-- Waiting overlay: only shown to host (player1) -->
<div class="wait-overlay" id="wait-overlay" style="display:none">
  <div class="wait-box">
    <div class="spinner"></div>
    <div class="wait-title">Raqib kutilmoqda...</div>
    <div class="wait-sub">Xona kodi:</div>
    <div class="wait-code" id="wait-code">&#8212;</div>
    <div class="wait-sub">Raqibingizga shu kodni yuboring</div>
    <button class="cancel-btn" onclick="goHome()">&#10006; Bekor qilish</button>
  </div>
</div>

<!-- Result overlay -->
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="result-icon" id="res-icon">&#9733;</span>
    <div class="result-title" id="res-title"></div>
    <div class="result-sub"   id="res-sub"></div>
    <div class="result-coins" id="res-coins"></div>
    <div class="result-btns">
      <button class="res-btn res-play" onclick="resetGame()">&#8635; Qayta</button>
      <button class="res-btn res-home" onclick="goHome()">&#8962; Uy</button>
    </div>
  </div>
</div>

<script src="firebase.js"></script>
<script src="coins.js"></script>
<script>
// ── SESSION ──
const session  = JSON.parse(localStorage.getItem('gz_session') || '{}');
const myKey    = localStorage.getItem('gz_current_user') || '';
const p1Key    = session.player1 || myKey;
const p2Key    = session.player2 || 'cpu';
const roomCode = session.roomCode || '';
const reward   = session.reward   || 75;
const isSolo   = !session.player2 || session.player2 === 'cpu';
const amIP1    = myKey === p1Key;

const usersObj = getUsers();
const p1User   = usersObj[p1Key] || { username: p1Key || "O'yinchi 1", skinColor: '#ef4444' };
const p2User   = isSolo
  ? { username: 'CPU [AI]', skinColor: '#0ea5e9' }
  : (usersObj[p2Key] || { username: p2Key, skinColor: '#0ea5e9' });

// ── CONSTANTS ──
const ROWS = 6, COLS = 7;

// ── STATE ──
let grid, currentPlayer, gameOver, _stateUnsub, _cancelRoom;

// ── INIT ──
window.addEventListener('DOMContentLoaded', function() {
  document.getElementById('nav-coins').textContent = getCurrentUser()?.coins || 0;
  setupPlayers();
  buildBoard();
  resetGame();
  if (!isSolo) initMultiplayer();
});

function setupPlayers() {
  document.getElementById('p1-name').textContent        = p1User.username;
  document.getElementById('p1-avatar').textContent      = p1User.username.charAt(0).toUpperCase();
  document.getElementById('p1-avatar').style.background = p1User.skinColor || '#ef4444';
  document.getElementById('p2-name').textContent        = p2User.username;
  document.getElementById('p2-avatar').textContent      = p2User.username.charAt(0).toUpperCase();
  document.getElementById('p2-avatar').style.background = p2User.skinColor || '#0ea5e9';
}

function buildBoard() {
  // Column drop buttons
  var btnWrap = document.getElementById('col-btns');
  btnWrap.innerHTML = '';
  for (var c = 0; c < COLS; c++) {
    var btn = document.createElement('button');
    btn.className = 'col-btn';
    btn.id = 'cb-' + c;
    btn.innerHTML = '&#9660;';
    btn.setAttribute('data-col', c);
    btn.onclick = (function(col){ return function(){ dropPiece(col); }; })(c);
    btnWrap.appendChild(btn);
  }
  // Board cells
  var boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (var r = 0; r < ROWS; r++) {
    var row = document.createElement('div');
    row.className = 'row';
    for (var cc = 0; cc < COLS; cc++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'c-' + r + '-' + cc;
      row.appendChild(cell);
    }
    boardEl.appendChild(row);
  }
}

// ── MULTIPLAYER ──
function initMultiplayer() {
  if (!roomCode) return;

  if (amIP1) {
    // Host: show waiting overlay with room code
    document.getElementById('wait-overlay').style.display = 'flex';
    document.getElementById('wait-code').textContent = roomCode;
  } else {
    // Guest: hide waiting overlay
    document.getElementById('wait-overlay').style.display = 'none';
  }

  // enterRoom handles both host and guest logic
  _cancelRoom = enterRoom('connect4', roomCode, myKey, function(p1, p2) {
    document.getElementById('wait-overlay').style.display = 'none';
    if (!p1 || !p2) {
      showToast('Ulanishda xatolik!', 'error');
      return;
    }
    showToast('Raqib ulandi! O\'yin boshlandi!');
    setConnBadge(true);
  });

  // Listen for opponent moves
  _stateUnsub = listenState('connect4', roomCode, function(data) {
    if (!data || gameOver) return;
    // Only apply state when it's now our turn (opponent just moved)
    var myTurn = amIP1 ? 1 : 2;
    if (data.currentPlayer === myTurn) {
      grid          = data.grid;
      currentPlayer = data.currentPlayer;
      renderGrid();
      updateStatus();
      highlightActive();
      var wc = fullWinCheck();
      if (wc) {
        endGame(wc.player, wc.cells);
      } else if (isBoardFull()) {
        endGame(0, []);
      }
    }
  });

  setConnBadge(true);
}

function setConnBadge(online) {
  var b = document.getElementById('conn-badge');
  b.className = 'conn-badge ' + (online ? 'online' : 'offline');
  document.getElementById('conn-text').textContent = online ? 'Ulangan' : 'Ulanmagan';
}

// ── GAME LOGIC ──
function resetGame() {
  grid = [];
  for (var r = 0; r < ROWS; r++) {
    var rowArr = [];
    for (var c = 0; c < COLS; c++) rowArr.push(0);
    grid.push(rowArr);
  }
  currentPlayer = 1;
  gameOver      = false;
  document.getElementById('result-overlay').classList.remove('show');

  for (var r2 = 0; r2 < ROWS; r2++) {
    for (var c2 = 0; c2 < COLS; c2++) {
      var el = document.getElementById('c-' + r2 + '-' + c2);
      if (el) el.className = 'cell';
    }
  }
  for (var cc = 0; cc < COLS; cc++) {
    var b = document.getElementById('cb-' + cc);
    if (b) b.disabled = false;
  }
  updateStatus();
  highlightActive();
  if (!isSolo) pushState();
}

function dropPiece(col) {
  if (gameOver) return;

  // Multiplayer turn check
  if (!isSolo) {
    var myTurn = amIP1 ? 1 : 2;
    if (currentPlayer !== myTurn) {
      showToast('Raqib navbati!', 'error');
      return;
    }
  }

  var row = getEmptyRow(col);
  if (row === -1) return;

  grid[row][col] = currentPlayer;
  var cell = document.getElementById('c-' + row + '-' + col);
  if (cell) cell.classList.add(currentPlayer === 1 ? 'p1' : 'p2');

  var winCells = checkWin(row, col, currentPlayer);
  if (winCells) {
    setTimeout(function(p, wc){ return function(){ endGame(p, wc); }; }(currentPlayer, winCells), 300);
    if (!isSolo) pushState();
    return;
  }
  if (isBoardFull()) {
    setTimeout(function(){ endGame(0, []); }, 300);
    if (!isSolo) pushState();
    return;
  }

  currentPlayer = currentPlayer === 1 ? 2 : 1;
  updateStatus();
  highlightActive();

  if (!isSolo) {
    pushState();
  } else if (currentPlayer === 2) {
    setTimeout(cpuMove, 520);
  }
}

function getEmptyRow(col) {
  for (var r = ROWS - 1; r >= 0; r--) {
    if (!grid[r][col]) return r;
  }
  return -1;
}

function isBoardFull() {
  for (var c = 0; c < COLS; c++) {
    if (grid[0][c] === 0) return false;
  }
  return true;
}

function pushState() {
  sendState('connect4', roomCode, {
    grid:          grid,
    currentPlayer: currentPlayer,
    ts:            Date.now()
  });
}

function renderGrid() {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var el = document.getElementById('c-' + r + '-' + c);
      if (!el) continue;
      el.className = 'cell';
      if      (grid[r][c] === 1) el.classList.add('p1');
      else if (grid[r][c] === 2) el.classList.add('p2');
    }
  }
}

// ── WIN CHECK ──
function checkWin(row, col, player) {
  var dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (var d = 0; d < dirs.length; d++) {
    var dr = dirs[d][0], dc = dirs[d][1];
    var line = getLine(row, col, dr, dc, player);
    if (line.length >= 4) return line;
  }
  return null;
}

function getLine(row, col, dr, dc, player) {
  var cells = [[row, col]];
  var signs = [-1, 1];
  for (var s = 0; s < 2; s++) {
    var sign = signs[s];
    var r = row + dr * sign;
    var c = col + dc * sign;
    while (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === player) {
      cells.push([r, c]);
      r += dr * sign;
      c += dc * sign;
    }
  }
  return cells;
}

function fullWinCheck() {
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      if (!grid[r][c]) continue;
      var w = checkWin(r, c, grid[r][c]);
      if (w) return { player: grid[r][c], cells: w };
    }
  }
  return null;
}

// ── CPU AI ──
function cpuMove() {
  var col = findWinMove(2);
  if (col === null) col = findWinMove(1);
  if (col === null && getEmptyRow(3) !== -1) col = 3;
  if (col === null) col = randomCol();
  if (col !== null) dropPiece(col);
}

function findWinMove(player) {
  for (var c = 0; c < COLS; c++) {
    var r = getEmptyRow(c);
    if (r === -1) continue;
    grid[r][c] = player;
    var w = checkWin(r, c, player);
    grid[r][c] = 0;
    if (w) return c;
  }
  return null;
}

function randomCol() {
  var valid = [];
  for (var c = 0; c < COLS; c++) {
    if (getEmptyRow(c) !== -1) valid.push(c);
  }
  return valid.length ? valid[Math.floor(Math.random() * valid.length)] : null;
}

// ── UI HELPERS ──
function highlightActive() {
  document.getElementById('p1-info').classList.toggle('active-player', currentPlayer === 1);
  document.getElementById('p2-info').classList.toggle('active-player', currentPlayer === 2);
}

function updateStatus() {
  var name = currentPlayer === 1 ? p1User.username : p2User.username;
  document.getElementById('status').textContent = name + ' navbati';
}

// ── END GAME ──
function endGame(winner, winCells) {
  gameOver = true;

  // Disable column buttons
  for (var c = 0; c < COLS; c++) {
    var btn = document.getElementById('cb-' + c);
    if (btn) btn.disabled = true;
  }

  // Highlight winning cells
  if (winCells && winCells.length) {
    for (var i = 0; i < winCells.length; i++) {
      var el = document.getElementById('c-' + winCells[i][0] + '-' + winCells[i][1]);
      if (el) el.classList.add('win');
    }
  }

  var icon, title, sub, coinsText = '';

  if (!winner) {
    // Draw
    icon  = '&#9868;';
    title = 'Durang!';
    sub   = 'Taxtada joy qolmadi!';
  } else {
    var iWon = (winner === 1 && amIP1) || (winner === 2 && !amIP1) || (isSolo && winner === 1);
    var winName = winner === 1 ? p1User.username : p2User.username;

    if (iWon) {
      icon      = '&#9733;';
      title     = "G'OLIBSIZ!";
      sub       = 'Tabriklaymiz, ' + winName + '!';
      coinsText = '+&#9679; ' + reward + ' tanga!';
      addCoins(reward);
      addResult(true);
      document.getElementById('nav-coins').textContent = getCurrentUser()?.coins || 0;
    } else if (isSolo && winner === 2) {
      icon  = '&#9711;';
      title = 'Yutqazdingiz';
      sub   = 'CPU yutdi!';
      addResult(false);
    } else {
      icon  = '&#9711;';
      title = 'Yutqazdingiz';
      sub   = winName + ' yutdi!';
      addResult(false);
    }
  }

  setTimeout(function() {
    document.getElementById('res-icon').innerHTML   = icon;
    document.getElementById('res-title').textContent = title;
    document.getElementById('res-sub').textContent   = sub;
    document.getElementById('res-coins').innerHTML   = coinsText;
    document.getElementById('result-overlay').classList.add('show');
    refreshCoinDisplay();
  }, 800);
}

function goHome() {
  if (_stateUnsub) _stateUnsub();
  if (_cancelRoom) _cancelRoom();
  window.location.href = 'dashboard.html';
}
